name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Core and web tests with coverage, then the CLI tests (they run the built bundle)
      - run: npm run test:coverage
      - run: npm test -w har-trace-viewer
      - run: npm run smoke

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image carries Chromium and the system packages it needs, so the job never
    # waits on an Ubuntu mirror. Keep its tag at the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # A no-op while the tag matches; after a @playwright/test bump it fetches the new Chromium.
      - run: npx playwright install chromium
      - run: npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
