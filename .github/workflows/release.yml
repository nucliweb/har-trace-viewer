name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches CLI version
        run: |
          version="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json ($version)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public -w har-trace-viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
