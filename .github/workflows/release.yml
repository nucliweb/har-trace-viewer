name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm-publish environment asks a maintainer to approve the run before it publishes.
    environment: npm-publish
    # contents: write lets the run create the GitHub Release for the tag
    # id-token: the OIDC token of the run, which npm (trusted publishing) accepts instead of a
    # stored secret
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Check tag matches CLI version
        run: |
          version="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json ($version)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Installs the packed tarball into a fresh project and runs the installed htv
      - run: npm run smoke
      # Trusted publishing: npm exchanges the OIDC token of this run for a short-lived one and
      # adds the provenance of the package
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --loglevel verbose
      # Creates the GitHub Release for the tag with generated notes; a rerun skips it when it exists
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
