name: Release

on:
  push:
    tags: ["v*"]

# One release at a time; a run in progress is left to finish, never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The npm-publish environment asks a maintainer to approve the run before it publishes.
    environment: npm-publish
    # contents: write lets the run create the GitHub Release for the tag
    # id-token: the OIDC token of the run, which npm (trusted publishing) accepts instead of a
    # stored secret
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to tell whether the tagged commit is on main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: this job holds the publishing token, and a cache is shared state
      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - name: Check tag matches CLI version
        run: |
          version="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli/package.json ($version)" >&2
            exit 1
          fi
      # The section of CHANGELOG.md for this version becomes the notes of the GitHub Release
      - name: Read the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Installs the packed tarball into a fresh project and runs the installed htv
      - run: npm run smoke
      # Trusted publishing: npm exchanges the OIDC token of this run for a short-lived one and
      # adds the provenance of the package
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --loglevel verbose
      # Creates the GitHub Release for the tag with its changelog section; a rerun skips it when it exists
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
